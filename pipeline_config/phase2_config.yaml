# ============================================================
# Phase2 Config — Method3 MI-based Acquisition (final_method3_spec §6-§16)
# ============================================================

# =============================================================================
# Skill planner transport — Phase2 candidate-batch 어디서 생성·선택할지
# =============================================================================
# mode:
#   disabled : skill planner 미설치. robot 은 cartesian-line trajectory 만 사용
#              → method3 phase2 useful-OOD selection 비활성. (default)
#   grpc     : H100 server (grpc_server.server) 가 모든 무거운 작업 담당.
#              client 는 server 가 고른 *단 1개의 trajectory* 만 받아 실행.
#              세부 server 설정 (endpoint / policy / buffer 등) 은
#              ``pipeline_config/phase2_server_infer_settings.yaml`` 에서 읽음.
#   local    : 같은 프로세스의 CuroboBackend + method3 phase2 selector.
#              (로컬 GPU 부족 시 비권장)
skill_planner_transport:
  mode: grpc                     # disabled | grpc | local

# --- frozen VLA encoder + Phase1 raw dataset (Phase2 시작 시 P_phase1 로드/구축) ---
phase1_trained_vla_path: "lerobot/outputs/train/smolvla_dct_distribute_chocolatepies_20260525_170417/checkpoints/last/pretrained_model"  # DCT-tuned ckpt (repo-relative — local/remote portable)

# phase1_dataset_path: Phase1 raw dataset. LeRobot v3.0 format.
phase1_dataset_path: "CoRL2026/table1/ours_distribute_chocolatepies"

# --- 전체 budget & phase 전환 (§15.3) ---
budget: 100                    # B — 전체 acquisition episode 수
phase1_min: 30                 # B_{1,min} — Phase1 최소 guard
phase1_max: 60                 # B_{1,max} — Phase1 최대 guard
tau_ready: 0.7                 # §15.1 — Phase2-readiness 전환 임계값
saturation_window: 10          # §15.2 — W (최근 accepted score 평균 window)
enable_phase2_early_stop: true # false → 공정비교용 (t=B 까지 강제 진행)

# --- DCT action descriptor (§4.2) — re-embedding·Phase2 공통 K ---
dct_coeffs: 3                  # K — z^a ∈ R^{K·action_dim}

# --- run 로그 ---
verbose: false                 # true → [method3:acq] run narration 로그

# --- Phase2-readiness (§15.1) ---
readiness:
  k_min: 3                     # covered window 최소 neighbor 수
  radius_k: 5                  # ρ_m 계산용 kNN k
  radius_quantile: 0.7         # ρ_m quantile (§16)

# --- MI-side usefulness + Useful-OOD selection (§8-13, useful_ood_updated) ---
mi_selection:
  # ─ Quadrant Validation (Table 6 — paradigm 4사분면 taxonomy 의 학습 효과 검증) ─
  # paradigm 의 4사분면 selection rule 을 mode 로 분기. Q1 (default) = Method3.
  #   Q1: argmax U_VLA  s.t.  M̃_MI ≥ +τ_MI   (Useful OOD — Method3 default)
  #   Q2: argmax U_VLA  s.t.  M̃_MI ≤ -τ_MI   (Harmful OOD — VLA novel + MI not-useful)
  #   Q3: argmin U_VLA  s.t.  M̃_MI ≥ +τ_MI   (Useful ID  — VLA familiar + MI useful)
  #   Q4: argmin U_VLA  s.t.  M̃_MI ≤ -τ_MI   (Redundant ID — VLA familiar + MI not-useful)
  # fallback (eligible=∅): Q1/Q3 → argmax M_MI ; Q2/Q4 → argmin M_MI.
  # Q1 이 아닌 mode 는 Table 6 실험용 — paper 의 default 는 Q1.
  selection_mode: Q1_med   # argmedian U_VLA s.t. M̃_MI ≥ +τ_MI (mid-novelty positive-MI)
                       # = "MI-aligned + VLA-uncertain": Phase1 분포 정합 cand 중
                       # VLA 가 가장 헷갈리는 것 (paper main claim)
  # ─────────────────────────────────────────────────────────────────────────
  k_nn_a: 5                    # §8 action-space kNN 의 k
  q_quantile: 0.5              # §8 ΔH_A top-quantile 비율
  k_min: 2                     # §9.1 covered window 최소 neighbor 수 (3→2 — covered 늘림)
  radius_k: 5                  # §16 ρ_m 계산용 kNN k
  radius_quantile: 0.9         # §16 ρ_m quantile (0.7→0.9 — radius 키워 covered 늘림)
  s_min_a: 0.001               # §9.3 local support scale floor
  eps: 1.0e-6                  # log/정규화 분모 안정화
  beta: 1.0                    # §11 ΔH_A 가중
  lambda: 1.0                  # §11 ΔH_A|S 가중 — MI parameter select experiment 결과 (results/skill_dct/mutual_information_parameter_select_experiment.md)
  tau_MI: 0.0                  # §13.2 — Useful-OOD/ID constraint: M̃_MI gate
                               # (0.0→0.3 — eligible ~50%→~30% 로 narrowing,
                               # Q1 chosen 의 Phase1 정합 강화)
                               # (0.8→0.0: 검증된 baseline 복귀 — session_20260523_013722
                               # 59/60 forward success 시 설정. 이전 변경 이력:
                               # 0.0→0.5(c41b6c0)→1.0→0.8(fe2d020)→0.0. 분야 관례상
                               # σ-multiple 직접 적용은 unusual, 분포 좁은 skill 에서
                               # fallback 폭증 위험. quantile/budget-aware 재설계는 후속)
  # accept_threshold 는 tau_MI 의 deprecated alias (구 yaml 호환). tau_MI 가 우선이지만
  # accept_threshold 만 지정해도 자동 매핑된다.
  amb_agg: mean                # §9.4 covered aggregation: mean | max
  min_covered_windows: 1       # §9.1 T_min — 미만이면 under-covered
  debug_verbose: true          # true → [Phase2-MI][debug] per-candidate 로그

# --- VLA-side informativeness U_VLA (§12, useful_ood_updated) ---
# Phase1-trained VLA 의 R-stochastic denoising loss 로 model-side novelty 점수.
# Useful-OOD rule (§13.2) 의 argmax 분기에서 우선순위를 결정한다.
vla_informativeness:
  enabled: true                # ← DCT paradigm 활성
  scorer_type: dct             # ← "dct" — candidate.dct_target 으로 single-step denoise loss
                               # frame-level chunk denoise) | "dct" = DCT paradigm 의
                               # single-step DCT denoise (R=1). dct 모드는 phase1_trained_vla_path
                               # 가 DCT-tuned ckpt 여야 의미 있음 (method3/dct/skill_dct_dataset).
  R: 8                         # default 전용. §12.1 stochastic denoise eval 횟수.
  agg: mean                    # default 전용. trajectory-level aggregator: mean | max
  sigma: 0.5                   # dct 전용. fixed σ → deterministic U_VLA (재현성). null=random.
  # 정책 체크포인트는 preselective_filter / re-embedding 의 phase1_trained_vla_path 와 공유.

# =============================================================================
# Skill-level perturbation — Phase2 candidate generator 의 dependency
# =============================================================================
# 옛 yaml 명: ``recording_config_ws*.yaml.perturbation.skill``
# 의미: curobo plan_batch 가 K transit candidate 를 1회 GPU 호출로 생성.
# Phase2 의 _skill_candidate_selector hook 이 이 K candidate 를 받아 §13.2
# Useful-OOD rule 로 ξ* 를 고른다.
#
# 활성화 조건: enabled_forward=true 여야 plan_batch 가 호출됨 → Phase2 의 hook 도
# trigger. false 면 hook 등록은 돼도 *trigger 되는 자리가 없어* useful-OOD
# selection 이 실제로 안 굴러간다. Phase2 acquisition 의 정상 동작에 필수.
skill_perturbation:
  enabled_forward: true
  enabled_reset: false
  # GPU-accelerated curobo motion planner with via-point diversity.
  n_candidates: 64
  curobo_robot_cfg_path: robot_configs/curobo/so101_robot0.yml
  curobo_num_trajopt_seeds: 4
  curobo_num_ik_seeds: 16
  curobo_use_cuda_graph: true     # graph capture 1회 → plan latency 50ms→5ms
  curobo_via_offset_mag: 0.15     # m — via-point 가 직선에서 떨어지는 거리
                                  # (0.22→0.18 절충: 0.22 는 workspace 경계 넘어
                                  # via IK fail 다수 발생 → trajopt 0 valid).
                                  # 2026-05-24 trial: 0.18→0.25 시도했으나 vert
                                  # 최대 30cm (=0.25·1.2) 이 workspace 경계 초과
                                  # → episode_46 부터 plan_batch returned 0 valid
                                  # candidates × 4 발생.
                                  # 2026-05-24 final: 0.20→0.15 — 사용자 관찰
                                  # "다양성 너무 큼" 응대. cand pool 의 공간 폭
                                  # 자체를 좁혀 chosen 의 모양이 더 단조해지게.
                                  # (lat ±15cm, vert 4.5~18cm).
  curobo_junction_smooth_k: 5     # cubic spline blend at via junction
  # K_max — candidate 당 최대 via 개수. 0=direct-only / 1=default / 2+ 더 다양.
  # 2: K=0/1/2 vias mix → 직선·1-bend·S자 3종 균일 quota (n=64면 [22,21,21]).
  # (3 시도 trial: max_vias=3 -> _cspace_batch 192->256 으로 CUDA graph
  # 재컴파일 시 curobo trajopt 가 64/64 silent fail. via_offset_mag 어떤
  # 값이든 무관. 2 로 revert — 작동 확인된 baseline.)
  curobo_max_vias_per_candidate: 2
  # joint-space 저주파 perturbation (A안) — collision-free curobo 경로에
  # Σ_{k=1}^{K} a_k·sin(kπt) 를 더해 질적으로 다양화. start/goal joint 보존.
  # K=2~3 저주파라 매끄러운 S자/곡선 (고주파 noise 아님). 0 = off.
  # NOTE: trajopt *후* 적용 — trajopt valid 비율과는 무관.
  curobo_joint_perturb_k: 3        # 저주파 항 개수 K
  curobo_joint_perturb_mag: 0.10   # rad — per-joint amplitude
                                   # (0.13→0.10 절충: mid joint 흔들림 ~17°)
                                   # (0.08→0.13: mid joint 흔들림 최대 ~22°)
  # SO-101: wrist_roll (joint index 4) 는 cartesian IK 가 start 값에 고정.
  fixed_joint_indices: [4]
  arm_joint_count: 5

# --- re-embedding (§6) ---
reembedding:
  skip_invalid: false          # true → validity_flag=False entry 건너뜀
  show_progress: true          # tqdm progress bar (false → 무음)
  frame_stride: 1              # 매 N번째 entry 만 re-embed (1 = spec 정석/전체, 기본).
                               # 5~10 → dense temporal sampling 의 redundancy 활용
                               # wall-clock 가속이 필요할 때만.
  batch_size: 32               # GPU batched VLA forward 의 배치 크기.
                               # encoder 가 encode_batch 지원 시 N개 한 forward 로
                               # 처리해 GPU 활용도 N배. 1 = single-loop legacy.
  # subgoal-aware filter (옵션 2) — ee_pos 와 subtask.target_position L2 distance
  # < R 인 frame 만 re-embed. cheap parquet read 로 *video decode 없이* pre-pass.
  # kNN 결과 보존 (candidate neighbor 는 어차피 subgoal 근처) — spec §6 의 *목적*
  # 충족하면서 10x 가속. null 이면 spec 정석 전체 re-embed.
  subgoal_filter_radius_m: 0.03    # 3 cm — *공격적 filter* (~3000 frames keep). client/server 토론 후 사용자 결정.
  subgoal_filter_min_keep: 30      # filter 후 frame 수가 이보다 적으면 R 자동 확장
  decode_workers: 4                # video decode 병렬 thread 수. RTX 3050 (= client) 권장 4.

# =============================================================================
# Phase2 Server (H100 gRPC) — 옛 phase2_server_infer_settings.yaml 통합 (2026-05-21)
# =============================================================================
# skill_planner_transport.mode=grpc 일 때 server-side 운영을 결정. policy.checkpoint
# 는 *제거* — 위의 phase1_trained_vla_path 가 *유일한 SoT*. mismatch race 가
# 사라진다 (옛 두 yaml 별개 관리로 인한 buggy state).

# --- 카메라 키 rename (raw capture key → policy image feature key) ---
# 학습 시 lerobot/scripts/train_DCT_smolvla.sh 의 CAMERA_RENAME_PAIRS 와
# *반드시 동일* 해야 한다. DCT-tuned VLA 는 observation.images.camera{N} 을
# 기대하는데, client 는 raw capture 키 (top / left_wrist) 로 이미지를 보낸다.
# server 가 plan_and_select / ingest 시점에 이 map 으로 키를 바꿔 encoder·
# VLA scorer 가 policy 와 정합되게 한다.
camera_rename:
  left_wrist: camera1
  top: camera2

# --- gRPC transport endpoint (client ↔ server 통신) ---
transport:
  address: "127.0.0.1:50063"
  timeout_s: 60.0
  debug_verbose: true                  # true → [skill_planner_transport] 로그 출력

# --- server-side P_phase1 build ownership ---
# false = server 자체 build 안 함 (client 가 build + scp upload). true = server
# 가 자체 build (yaml.phase1_dataset_path 받음). 2026-05-21: client 의 RTX 3050
# 이 server 의 H100 보다 *오히려 빠른* 측정 (video decode CPU bound 라 GPU 차이
# 의미 없음) → client 가 build + scp 가 더 실용적.
server_build_phase1: false

# --- server-side frozen VLA encoder runtime config ---
# checkpoint 는 위의 ``phase1_trained_vla_path`` 가 SoT — 여기 다시 적지 않음.
policy:
  family: smolvla                       # null → checkpoint 이름에서 자동 추론 (pi0/pi05/smolvla/groot)
  device: "cuda"
  autocast_dtype: bfloat16              # bfloat16 | float16 | float32
  state_weight: 1.0                     # state concat 의 weight

# --- action chunk horizon (H) + 평가 시점 cost cap ---
# spec §7.3:
#   ξ = {(S_τ, A_{τ:τ+H-1})}_{τ=1}^T,  A_{τ:τ+H-1} ∈ ℝ^{H × action_dim}
# 의미:
#   T = candidate trajectory ξ 의 *시간 길이* (= waypoint 개수 N).
#       yaml 에서 정하는 값이 아니라 curobo plan 결과로 자동 결정.
#   H = 한 시점 τ 에서 미리 보는 action prediction horizon (예: smolvla chunk_size).
#       각 시점 τ ∈ [1, T] 에서 action descriptor z_τ^a = ψ(A_{τ:τ+H-1}) 가 계산됨.
#       stride=1 sliding window. trajectory 끝부분 (τ+H-1 > T) 은 끝점 hold pad.
#
# - H=50 은 spec §7.3 line 741 (A ∈ ℝ^{50×6}) + smolvla policy chunk_size 와 일치.
#   H 를 바꾸면 P_phase1 vector DB 도 같은 H 로 *다시 build* 해야 한다 (key consistency).
# - ``selector.action_horizon`` 은 Phase1 re-embed (LeRobotPhase1RawAdapter) 와 Phase2
#   candidate gen (curobo_candidate_gen) *둘 다* 의 SoT.  method3/config.py 가 이 값을
#   reembedding 단계로 propagate.
# - ``max_T_eval`` (옵션): T = N 이 너무 클 때의 sub-sample cost cap. None = spec 직역
#   (모든 시점 평가). int 면 균일 간격으로 max_T_eval 개 시점만 평가. U_VLA enabled +
#   긴 trajectory 환경에서 평가 비용 폭주 방지용.
# - 옛 키 ``selector.chunk_size`` / ``selector.n_windows`` 는 deprecated. server 가
#   chunk_size → action_horizon 매핑은 backward-compat 유지, n_windows 는 무시됨.
selector:
  action_horizon: 50              # H — spec §7.3, smolvla chunk_size 와 일치
  max_T_eval: null                # 옵션 — null=모든 시점 평가 (spec 직역).
                                  # int 로 두면 trajectory 가 길 때 sub-sample.
  skill_dct_parquet: "results/skill_dct/ours_distribute_chocolatepies.parquet"  # P_phase1 build 의 sidecar (repo-relative)
                                  # parquet 경로. method3.dct.build_skill_dct 의 산물.

# --- server-local SkillVectorDB 영속화 ---
# server 가 boot/restart 사이에도 buffer 를 유지하기 위한 sidecar npz.
# save_dir 이 relative path 면 server.py 실행 위치 기준.
buffer:
  save_dir: "grpc_server/buffer"
  filename: "server_skill_wise_vector_db.npz"

# =============================================================================
# 원격 H100 SSH 연결 — grpc_server/launch_remote_server.sh 가 이 섹션을 읽어
# ssh 옵션을 자동 구성한다. ``~/.ssh/config`` 를 따로 건드릴 필요 없이 여기에
# 채우면 됨.
# 우선순위:
#   1) shell env var (REMOTE_HOST, SERVER_GPU_ID 등) — 임시 override
#   2) 아래 yaml 값                                  — 기본 source-of-truth
# alias 와 user/hostname 둘 다 채우면 alias 가 ~/.ssh/config 에 등록된 경우만 우선.
# =============================================================================
remote:
  # [선택] ~/.ssh/config 의 Host alias 를 미리 등록해뒀다면 여기에 그대로.
  ssh_alias: "h100"

  # [alias 가 없을 때 필수] 직접 연결 정보. ssh 명령에 -o 와 -i 로 전달.
  user: "csiwoo"
  hostname: "61.107.202.230"
  port: 22
  identity_file: ""                      # 예: "~/.ssh/id_ed25519"  (~ 자동 expand)

  # [필수] 원격 서버 운영
  project_path: "/home/csiwoo/CORL2026/AutoDataCollector-open_drawer"
  conda_env: "gpu_server"                # setup_h100_server.sh 가 setup 한 dedicated env
  gpu_id: 2                              # 원격 CUDA_VISIBLE_DEVICES — GPU 0 (open_drawer 전용 isolation)
  tmux_session: "phase2_server_open_drawer"   # 재시작 시 reuse; prefix unique (phase2_server_* family)

  # [선택] 동작 옵션
  git_pull_before_start: true
  ready_timeout_s: 360                   # smolvla 부팅 1~2분, pi05_base 2~5분 → 여유 360s

  # NVIDIA driver kernel/user-space mismatch workaround.
  # 빈 문자열 또는 미지정 → skip (system lib 사용).
  # 명시 시 (디렉토리 내에 usr/bin/nvidia-smi + usr/lib/x86_64-linux-gnu/libnvidia-ml.so*
  # 포함) → tmux 안 server 의 PATH/LD_LIBRARY_PATH 가 그 backport 우선 prepend.
  # 사용 case: system 이 NVIDIA driver user-space 만 패치하고 kernel module
  # reload 가 안 된 상태 ("Failed to initialize NVML: Driver/library version
  # mismatch") 우회.
  nvidia_backport_path: "/home/csiwoo/robobridge/nvidia_580_126_09"
