# Recording Configuration
# LeRobot 데이터셋 레코딩 관련 설정

# =============================================================================
# Dataset Configuration
# =============================================================================
dataset_repo_id: "CoRL2026/Sort_RGBblock_to_matchingplate_10fps" # Hugging Face Hub repository ID (e.g., "username/repo_name") or local path
recording_fps: 10
robot_type: "so101"
vcodec: "h264"  # Video codec: h264, hevc, libsvtav1, auto, h264_nvenc, h264_videotoolbox, h264_vaapi, h264_qsv

# =============================================================================
# Camera Configuration
# =============================================================================
# 공식 LeRobot bi_so_follower 패턴:
#   - shared: 특정 로봇에 귀속되지 않는 공용 카메라 (탑뷰 등)
#             feature name: observation.images.{name}
#   - left_arm / right_arm: 각 로봇에 물리적으로 장착된 카메라
#             feature name: observation.images.left_{name}, observation.images.right_{name}

cameras:
  ## 공용 카메라 (워크스페이스 전체 촬영 — 물체 검출, judge 등에 사용)
  shared:
    - name: "top"
      type: "realsense"
      serial_number: "335622072328"  # WS1 전용 RealSense
      enabled: true
      enable_depth: true
      width: 640
      height: 480
      fps: 30

  ## Left arm 카메라 (ROBOT_IDS[0]에 매핑)
  left_arm:
    - name: "wrist"
      type: "opencv"
      enabled: true
      index_or_path: "/dev/video6"
      width: 640
      height: 480
      fps: 30
      fourcc: "MJPG"

  # ## Right arm 카메라 (ROBOT_IDS[1]에 매핑)
  # right_arm:
  #   - name: "wrist"
  #     type: "opencv"
  #     enabled: true
  #     index_or_path: "/dev/video16"
  #     width: 640
  #     height: 480
  #     fps: 30
  #     fourcc: "MJPG"

# =============================================================================
# Skill Features Configuration
# =============================================================================
## skill.* feature 개별 on/off 설정
## false로 설정하면 해당 feature가 dataset에 기록되지 않음
skill_features:
  natural_language: true    # skill.natural_language (자연어 스킬 설명)
  verification_question: true  # skill.verification_question (스킬 성공 확인 질문)
  type: true               # skill.type (move_to, pick, place 등)
  progress: true           # skill.progress (0.0~1.0 진행률)
  goal_position:
    joint: true            # skill.goal_position.joint (목표 joint 위치)
    robot_xyzrpy: true     # skill.goal_position.robot_xyzrpy (robot 좌표계)
    gripper: true          # skill.goal_position.gripper (gripper 상태)

# =============================================================================
# Sub-task Features Configuration (Reset recording용 상위 계층 라벨)
# =============================================================================
## subtask.* feature 개별 on/off 설정
## 여러 skill을 묶는 상위 계층 라벨 (예: "move red block to [0.29, 0.12, 0.01]")
subtask_features:
  natural_language: true      # subtask.natural_language (자연어 서브태스크 설명)
  object_name: true           # subtask.object_name (대상 객체 이름)
  target_position: true       # subtask.target_position (목표 위치 [x, y, z])

# =============================================================================
# Observation Features Configuration
# =============================================================================
## observation.* 추가 feature 개별 on/off 설정
## 활성화 시 매 프레임마다 FK(순운동학)를 계산하여 EE 자세를 기록합니다
## FK 계산 비용은 ~0.1ms로 50Hz 제어 루프에 영향 없음
observation_features:
  ee_pos:
    robot_xyzrpy: true    # observation.ee_pos.robot_xyzrpy (robot base_link 좌표계 EE 자세 [x,y,z,r,p,y])
  gripper_binary: true    # observation.gripper_binary (그리퍼 열림=1.0 / 닫힘=0.0)
  # URDF 0° 기준 radian (arm 5D + gripper 1D, 하드웨어 독립 학습용)
  radian_urdf0:
    state: true            # observation.state.radian_urdf0 (URDF 0° 기준 관절 위치, 6D radian)
    action: true           # action.radian_urdf0        (URDF 0° 기준 목표 관절 위치, 6D radian)

# =============================================================================
# Stochastic Perturbation Configuration
# =============================================================================
## Transit subgoal에 3D Gaussian offset을 주입하여 trajectory 다양성 + recovery 신호 생성.
## - skill_type이 transit("move", "move_initial", "move_free")인 호출에만 offset 적용
## - interaction skill(grasp, place, gripper, rotate, move_and_close/open)은 절대 보호
## - 매 skill 호출마다 새 offset 샘플 (truncated isotropic Gaussian, robot base frame)
## - RNG seed: episode_seed * 10000 + trial_index (재현 가능)
perturbation:
  subgoal:
    enabled: false     # true → transit subgoal 위치 변형 활성화
    sigma: 0.05           # metres; isotropic Gaussian 표준편차 (robotwin 기준값)
    clip_factor: 2.0      # truncate at clip_factor * sigma (최대 offset = 0.10m)

  ## Skill-level perturbation (OMPL planner ensemble — Phase 5)
  ## - is_transit=True 인 move_to_position 호출에만 적용 (subgoal 과 동일한 가드)
  ## - 매 호출 시 N 개 후보 trajectory 를 OMPL 알고리즘 (RRTConnect/PRMstar/BITstar/KPIECE1) 다양하게 병렬 plan
  ## - RNG-driven 으로 1 개를 선택하여 cartesian-line 대신 실행 → trajectory shape 자체 변형
  ## - subgoal 과 직교: 둘 다 켜면 perturbed-target × ompl-shape 모두 적용
  ## - daemon (mplib_env) 자동 spawn; 비활성 시 daemon 안 띄움
  ## - workspace 정의는 robot 별 collision world (table, ceiling, 다른 arm bbox).
  ##   skill perturbation 미사용해도 daemon 안 뜨므로 비용 0.
  skill:
    enabled: false        # true → OMPL ensemble 기반 trajectory 변형 활성화
    n_candidates: 4       # plan_batch 의 N — 4 algorithm round-robin 분배
    planning_time: 0.5    # seconds, 알고리즘별 .solve() 예산
    waypoint_density: 0.02  # m — joint-distance 기반 출력 waypoint 밀도
    n_workers: 4          # daemon 의 multiprocessing.Pool 워커 수 (CPU 코어 ≤)
    algorithms:           # 활성화할 OMPL 알고리즘 (다양한 모드 → 다양한 path 형상)
      - RRTConnect
      - PRMstar
      - BITstar
      - KPIECE1
    workspace:
      table_enabled: true
      table_z: 0.0          # 로봇 base_link 기준 테이블 표면 z (m)
      table_thickness: 0.10 # 테이블 두께 (m); plan 이 표면 아래로 dip 하는 것 차단
      table_size: [2.0, 2.0]
      table_mount_links: [base_link]   # ACM whitelist (base 가 테이블에 mount 됨)
      ceiling_enabled: false
      other_arms: []        # bi-arm 시 [{name, size: [x,y,z], center: [x,y,z]}]
