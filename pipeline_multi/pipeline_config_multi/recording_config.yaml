# Recording Configuration for Multi-Robot Pipeline
# LeRobot 데이터셋 레코딩 관련 설정
# 각 로봇별로 별도의 데이터셋이 생성됩니다.

# =============================================================================
# Global Recording Settings (모든 로봇에 공통 적용)
# =============================================================================
recording_fps: 30
robot_type: "so101"

# =============================================================================
# Robot-specific Dataset Settings
# 각 로봇별 데이터셋 경로 설정
# 실제 저장 시 timestamp가 자동 추가됨: {dataset_repo_id}_{timestamp}
# =============================================================================
robots:
  - robot_id: 2
    dataset_repo_id: "local/robot2_multi_dataset"
    enabled: true

  - robot_id: 3
    dataset_repo_id: "local/robot3_multi_dataset"
    enabled: true

# =============================================================================
# Shared Camera Configuration
# 모든 로봇이 공유하는 카메라 설정
# =============================================================================
cameras:
  ## Intel RealSense D435 (공유)
  ## pyrealsense2 SDK가 자동 감지 (serial_number로 특정 카메라 지정 가능)
  - name: "realsense"
    type: "realsense"
    serial_number: "335622072328"
    enabled: true
    enable_depth: true
    width: 640
    height: 480
    fps: 30

  ## Innomaker U20CAM 1080p (공유)
  ## OpenCV는 index_or_path로 장치 경로 지정 필요
  ## v4l2-ctl --list-devices로 확인
  - name: "innomaker"
    type: "opencv"
    enabled: true
    index_or_path: "/dev/video6"
    width: 640
    height: 480
    fps: 30
    fourcc: "MJPG"
